# Prometheus 配置文件 — RelayDesk 企业统一服务台

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'relaydesk'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # RelayDesk 主应用指标
  - job_name: 'relaydesk-app'
    static_configs:
      - targets: ['relaydesk:8000']
        labels:
          service: 'relaydesk'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
